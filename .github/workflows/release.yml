name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package-and-release:
    # electron-builder --mac only runs on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run package

      - name: Attach .dmg to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.dmg
          generate_release_notes: true
